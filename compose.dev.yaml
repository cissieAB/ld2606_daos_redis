services:
  redis:
    image: redis/redis-stack-server:latest
    # Archive the previous run's data and start empty; see redis/start-fresh.sh.
    entrypoint: ["/start-fresh.sh"]
    environment:
      # Append-only file = Redis's write-ahead log; it is what gets archived.
      REDIS_ARGS: --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/start-fresh.sh:/start-fresh.sh:ro,Z
      - ./redis-archive:/archive:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: go run .
    environment:
      REDIS_ADDR: redis:6379
      SERVER_PORT: :8080
      POLL_INTERVAL: 1s
      # Per-run topology: TOPOLOGY_PATH=config/topology.<run>.json docker compose ... up
      TOPOLOGY_PATH: ${TOPOLOGY_PATH:-config/topology.json}
      DEBUG: true
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app:Z
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      redis:
        condition: service_healthy

  simulator:
    profiles: ["tools"]
    build:
      context: ./traffic-simulator
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sleep infinity
    volumes:
      - ./traffic-simulator:/app:Z
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  go-mod-cache:
  go-build-cache:
